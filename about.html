<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="about.title">这是个什么玩意？</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="cicida.ico" type="image/x-icon">
</head>
<body>

    <div id="navbar">
        <div class="nav-left">
            <img src="zizaziza-en.svg" alt="Zizaziza" class="nav-text-logo" />
            <div class="nav-menu">
                <a href="index.html" class="nav-item" data-i18n="nav.overview">概览</a>
                <a href="value.html" class="nav-item" data-i18n="nav.value">价值</a>
                <a href="uniqueness.html" class="nav-item" data-i18n="nav.uniqueness">独特性</a>
                <a href="solutions.html" class="nav-item" data-i18n="nav.solutions">解决的问题</a>
                <a href="about.html" class="nav-item active" data-i18n="nav.about">关于</a>
                <!-- 移动端语言选择器 -->
                <div class="mobile-language-selector">
                    <select id="mobile-language-selector">
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="zh-HK">繁體中文(香港)</option>
                        <option value="zh-TW">繁體中文(台灣)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <select id="language-selector" class="nav-item">
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
                <option value="zh-HK">繁體中文(香港)</option>
                <option value="zh-TW">繁體中文(台灣)</option>
            </select>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- 关于内容 -->
    <div id="value-section">
        <div class="value-content">
            <!-- 页面标题 -->
            <div class="value-section1-header">
                <div class="value-section1-line1" data-i18n="about.me.title">关于我</div>
            </div>
            
            <!-- 关于信息 -->
            <div class="value-item">
                <p><span data-i18n="about.info.status">学生，现居北京</span><span class="location-note" data-i18n="about.info.beijing">(上学)</span>、<span data-i18n="about.info.guilin.city">桂林</span><span class="location-note" data-i18n="about.info.guilin">(家乡)</span></p>
                <p data-i18n="about.contact.email">联系：hi@zizaziza.com</p>
            </div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script>
        // 汉堡菜单功能
        // 汉堡菜单功能
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        
        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // 点击外部关闭菜单
        document.addEventListener('click', function(e) {
            if (!hamburger.contains(e.target) && !navMenu.contains(e.target) && 
                !document.querySelector('.mobile-language-selector').contains(e.target)) {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            }
        });

        // 初始化语言
        initializeLanguage();

        // 语言选择器事件
        document.getElementById('language-selector').addEventListener('change', function() {
            switchLanguage(this.value);
        });

        document.getElementById('mobile-language-selector').addEventListener('change', function() {
            switchLanguage(this.value);
        });

        // 滚动时导航栏隐藏效果
        let lastScrollY = 0;
        let isScrollingDown = false;
        
        window.addEventListener('scroll', function() {
            const scrollY = window.scrollY;
            const navbar = document.getElementById('navbar');
            
            // 判断滚动方向
            isScrollingDown = scrollY > lastScrollY;
            lastScrollY = scrollY;
            
            // 根据滚动方向控制导航栏显示/隐藏
            if (isScrollingDown && scrollY > 100) {
                // 向下滚动且超过100px时隐藏导航栏
                navbar.style.transform = 'translateY(-100%)';
                navbar.style.transition = 'transform 0.3s ease';
            } else {
                // 向上滚动或接近顶部时显示导航栏
                navbar.style.transform = 'translateY(0)';
            }
        });

    </script>
</body>
</html>
